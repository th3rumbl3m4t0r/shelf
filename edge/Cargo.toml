[package]
name = "shelf-edge"
version = "0.1.0"
edition = "2021"
description = "Public relay and file cache in front of a shelf server at home"
license = "GPL-3.0-or-later"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
bytes = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "tracing"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
